<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0B1220"/>
  <!-- Shield -->
  <path d="M256 72 L400 140 L400 280 Q400 380 256 448 Q112 380 112 280 L112 140 Z" 
        fill="url(#shieldGrad)" opacity="0.9"/>
  <!-- Shield inner glow -->
  <path d="M256 100 L376 158 L376 272 Q376 358 256 418 Q136 358 136 272 L136 158 Z" 
        fill="#0B1220" opacity="0.35"/>
  <!-- Gear -->
  <g transform="translate(256,265) scale(1.1)" fill="url(#gearGrad)">
    <path d="M0,-72 L14,-68 L18,-52 L32,-46 L46,-54 L56,-44 L48,-30 L52,-16 L68,-12 L72,0 L68,12 L52,16 L48,30 L56,44 L46,54 L32,46 L18,52 L14,68 L0,72 L-14,68 L-18,52 L-32,46 L-46,54 L-56,44 L-48,30 L-52,16 L-68,12 L-72,0 L-68,-12 L-52,-16 L-48,-30 L-56,-44 L-46,-54 L-32,-46 L-18,-52 L-14,-68 Z"/>
    <circle cx="0" cy="0" r="28" fill="#0B1220" opacity="0.7"/>
    <circle cx="0" cy="0" r="18" fill="url(#shieldGrad)" opacity="0.6"/>
  </g>
  <!-- Checkmark inside gear -->
  <path d="M244 270 L254 280 L272 254" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
